version: "3.8"
services:
  backend:
    build: .
    container_name: hiccup_backend
    depends_on:
      - mysql
      - redis
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=example
      - DB_NAME=hiccup_ticket
      - ENABLE_SCHEMA_BOOTSTRAP=1
      # Remote/main auth DB (users table)
      - MAIN_DB_HOST=remote-db-host
      - MAIN_DB_PORT=3306
      - MAIN_DB_USER=remote-db-user
      - MAIN_DB_PASSWORD=remote-db-password
      - MAIN_DB_NAME=lead_management
      - JWT_SECRET=supersecret
      - JWT_ALGO=HS256
      - WHATSAPP_API_URL=http://10.1.1.181:3004/api/messages/send
      - WHATSAPP_API_TOKEN=61e3f2cd978650537d9223e7
      - MANAGEMENT_GROUP_NUMBERS=120363141953100908@g.us
      - INTERNAL_SERVICE_TOKEN=internal-token
      - FRONTEND_BASE_URL=http://10.1.1.53:3010
      - WHATSAPP_RESPONSE_BASE_URL=http://10.1.1.53:3010
      - EXTERNAL_WHATSAPP_RESPONSE_BASE_URL=https://labmate.bhasinpathlabs.com:4666
      - TIMEZONE=Asia/Kolkata
      - INFRA_PICK_SLA_START=11:00
      - INFRA_PICK_SLA_END=17:00
      - INFRA_SLA_HOLIDAYS=2026-01-26,2026-08-15,2026-10-02,2026-12-25
      - ASSET_DB_HOST=mysql
      - ASSET_DB_PORT=3306
      - ASSET_DB_USER=root
      - ASSET_DB_PASSWORD=example
      - ASSET_DB_NAME=asset_management
      - ASSET_UPLOAD_DIR=/app/asset_uploads
      - ASSET_BASE_PATH=/assets
      - ASSET_PUBLIC_BASE_URL=https://labmate.bhasinpathlabs.com:4666/assets
      - REDIS_ENABLED=1
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "3010:3010"
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./asset_uploads:/app/asset_uploads
    restart: unless-stopped
  scheduler:
    build: .
    container_name: hiccup_scheduler
    depends_on:
      - mysql
      - redis
    command: ["python", "-m", "app.core.scheduler_runner"]
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=example
      - DB_NAME=hiccup_ticket
      - ENABLE_SCHEMA_BOOTSTRAP=1
      - MAIN_DB_HOST=remote-db-host
      - MAIN_DB_PORT=3306
      - MAIN_DB_USER=remote-db-user
      - MAIN_DB_PASSWORD=remote-db-password
      - MAIN_DB_NAME=lead_management
      - JWT_SECRET=supersecret
      - JWT_ALGO=HS256
      - WHATSAPP_API_URL=http://10.1.1.181:3004/api/messages/send
      - WHATSAPP_API_TOKEN=61e3f2cd978650537d9223e7
      - MANAGEMENT_GROUP_NUMBERS=120363141953100908@g.us
      - INTERNAL_SERVICE_TOKEN=internal-token
      - FRONTEND_BASE_URL=http://10.1.1.53:3010
      - WHATSAPP_RESPONSE_BASE_URL=http://10.1.1.53:3010
      - EXTERNAL_WHATSAPP_RESPONSE_BASE_URL=https://labmate.bhasinpathlabs.com:4666
      - TIMEZONE=Asia/Kolkata
      - INFRA_PICK_SLA_START=11:00
      - INFRA_PICK_SLA_END=17:00
      - INFRA_SLA_HOLIDAYS=2026-01-26,2026-08-15,2026-10-02,2026-12-25
      - ASSET_DB_HOST=mysql
      - ASSET_DB_PORT=3306
      - ASSET_DB_USER=root
      - ASSET_DB_PASSWORD=example
      - ASSET_DB_NAME=asset_management
      - ASSET_UPLOAD_DIR=/app/asset_uploads
      - ASSET_BASE_PATH=/assets
      - ASSET_PUBLIC_BASE_URL=https://labmate.bhasinpathlabs.com:4666/assets
      - REDIS_ENABLED=1
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./asset_uploads:/app/asset_uploads
    restart: unless-stopped
  mysql:
    image: mysql:8
    container_name: hiccup_mysql
    environment:
      - MYSQL_ROOT_PASSWORD=example
      - MYSQL_DATABASE=hiccup_ticket
    ports:
      - "8091:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./db/asset_management.sql:/docker-entrypoint-initdb.d/asset_management.sql:ro
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    container_name: hiccup_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: hiccup_phpmyadmin
    depends_on:
      - mysql
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306
      - PMA_USER=root
      - PMA_PASSWORD=example
    ports:
      - "8082:80"
    restart: unless-stopped
volumes:
  mysql_data:
  redis_data:
