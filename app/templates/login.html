{% extends 'base.html' %}
{% block body %}
<div class="relative mx-auto my-16 w-full max-w-md">
    <div class="absolute inset-0 rounded-3xl bg-gradient-to-br from-teal-200 to-white opacity-70 blur-3xl"></div>
    <div class="relative rounded-3xl border border-slate-200 bg-white/95 p-8 shadow-2xl">
        <div class="flex items-center gap-4">
            <img src="/static/img/Logoicon.png" alt="Dr Bhasin's Lab" class="h-12 w-12">
            <div>
                <p class="text-sm font-semibold text-tealbrand">Dr Bhasin's Hiccup Lab</p>
                <p class="text-xs text-slate-500">Trusted quality & service in hiccup management.</p>
            </div>
        </div>
        <h2 class="mt-6 text-2xl font-semibold text-slate-900">Welcome Back</h2>
        <p class="text-sm text-slate-500">Sign in to Create, track, and resolve hiccups with your team.</p>
        <form id="login-form" class="mt-6 space-y-4">
            <div class="space-y-1">
                <label for="username" class="text-sm font-semibold text-slate-700">Username</label>
                <input id="username" name="username" required autocomplete="off" placeholder="Start typing name" class="w-full rounded-2xl border border-slate-200 bg-slate-50/60 px-4 py-3 text-sm text-slate-900 transition focus:border-tealbrand focus:ring-2 focus:ring-tealbrand/50">
                <div id="username-suggestions" class="mt-2 space-y-1 max-h-60 overflow-y-auto rounded-2xl border border-slate-200 bg-white shadow-sm"></div>
            </div>
            <div class="space-y-1">
                <label for="password" class="text-sm font-semibold text-slate-700">Password (enter DOB digits)</label>
                <input id="password" name="password" type="password" inputmode="numeric" required placeholder="DDMMYYYY (e.g. 23052000)" class="w-full rounded-2xl border border-slate-200 bg-slate-50/60 px-4 py-3 text-sm text-slate-900 transition focus:border-tealbrand focus:ring-2 focus:ring-tealbrand/50">
                <p class="text-xs text-slate-400">Use your date of birth without slashes.</p>
            </div>
            <button class="w-full rounded-2xl bg-tealbrand px-4 py-3 text-sm font-semibold text-white shadow-lg shadow-tealbrand/30 transition hover:bg-tealbrand-dark hover:-translate-y-0.5" type="submit">Login</button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function verifyTokenAndRedirect(){
    try {
        const res = await fetch('/api/auth/me', {
            method: 'GET',
            credentials: 'same-origin',
        });
        if(res.ok){
            window.location.href = '/dashboard';
            return;
        }
    } catch {
        // ignore, will clear state below
    }
    clearAuthState();
}

async function fetchUserSuggestions(query) {
    try {
        const params = new URLSearchParams();
        if (query) params.set('q', query);
        params.set('limit', '10');
        const res = await fetch(`/api/auth/users?${params.toString()}`);
        if (!res.ok) return [];
        return res.json();
    } catch (err) {
        console.error('Failed to load user suggestions', err);
        return [];
    }
}

function renderSuggestions(container, names, inputEl) {
    if (!container) return;
    if (!names || names.length === 0) {
        container.innerHTML = '';
        return;
    }
    container.innerHTML = names.map(n => `<button type="button" class="w-full text-left px-4 py-2 text-sm text-slate-700 transition hover:bg-slate-100">${n}</button>`).join('');
    container.querySelectorAll('button').forEach(item => {
        item.addEventListener('click', () => {
            inputEl.value = item.textContent || '';
            inputEl.focus();
            container.innerHTML = '';
        });
    });
}

document.addEventListener('DOMContentLoaded', () => {
    verifyTokenAndRedirect();
    const form = document.getElementById('login-form');
    form?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(form);
        const payload = {username: formData.get('username'), password: formData.get('password')};
        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify(payload),
                credentials: 'same-origin',
            });
            if(res.ok){
                const data = await res.json();
                await showAlert({
                    icon: 'success',
                    title: 'Signed in',
                    text: 'Redirecting to your dashboard',
                    timer: 1200,
                    showConfirmButton: false,
                });
                window.location.href = '/dashboard';
                return;
            }
            await showAlert({
                icon: 'error',
                title: 'Sign in failed',
                text: 'Credentials seem incorrect. Please try again.',
            });
        } catch (err) {
            await showAlert({
                icon: 'error',
                title: 'Unable to reach server',
                text: err?.message || 'Please try again shortly.',
            });
        }
    });

    const suggestionsEl = document.getElementById('username-suggestions');
    const usernameInput = document.getElementById('username');
    let suggestionTimer;
    usernameInput?.addEventListener('input', (e) => {
        const value = e.target.value.trim();
        clearTimeout(suggestionTimer);
        if (!value) {
            renderSuggestions(suggestionsEl, [], usernameInput);
            return;
        }
        suggestionTimer = setTimeout(async () => {
            const names = await fetchUserSuggestions(value);
            renderSuggestions(suggestionsEl, names, usernameInput);
        }, 200);
    });
});
</script>
{% endblock %}
