{% extends 'layout.html' %}
{% block content %}
<section class="hiccup-shell rounded-3xl border border-slate-200 bg-white/90 p-8 shadow-2xl shadow-slate-200/50">
    <style>
      @media (max-width: 767px) {
        #raised-by-section,
        #against-me-section {
          display: none !important;
        }
      }
      @media (min-width: 768px) {
        #raised-by-cards,
        #against-me-cards {
          display: none !important;
        }
      }
    </style>
    <div class="hiccup-sticky-tabs">
        <div class="hiccup-view-tabs">
            <button id="tab-raised-by" type="button" class="hiccup-view-tab is-active" aria-selected="true">By me</button>
            <button id="tab-against-me" type="button" class="hiccup-view-tab" aria-selected="false">For me</button>
        </div>
    </div>
    <div class="hiccup-inline-filterbar mt-4">
        <label><span>Date From</span><input id="filter-date-from" type="date"></label>
        <label><span>Date To</span><input id="filter-date-to" type="date"></label>
        <label><span>Status</span><select id="filter-status"><option value="">All</option><option>Open</option><option>Responded</option><option>Closed</option><option>Escalated to NC</option></select></label>
        <label><span>Type</span><select id="filter-type"><option value="">All</option><option>Person Related</option><option>System Related</option></select></label>
        <label class="hiccup-inline-check"><input id="filter-escalated" type="checkbox"><span>Escalated</span></label>
        <label class="hiccup-inline-check"><input id="filter-overdue" type="checkbox"><span>Overdue</span></label>
        <label class="hiccup-inline-check"><input id="filter-response-blocked" type="checkbox"><span>Response Blocked</span></label>
        <label class="hiccup-inline-search"><span>Search</span><input id="global-hiccup-search" type="search" placeholder="name / mobile / hiccup id"></label>
        <button type="button" data-filter-apply="my">Apply</button>
        <button id="reset-filters" type="button" class="hiccup-inline-clear">Clear</button>
    </div>
    <div id="my-active-filters" class="hiccup-active-filters mt-3"></div>
    <div id="raised-by-cards" class="space-y-3 mt-4 hidden"></div>
    <div id="raised-by-section" class="table-scroll mt-4 hidden">
        <table id="my-hiccups-table" class="enhanced-table">
            <thead class="bg-slate-50 text-xs uppercase tracking-[0.3em] text-slate-400">
                <tr>
                    <th class="px-4 py-3 text-left">ID</th>
                    <th class="px-4 py-3 text-left">Type</th>
                    <th class="px-4 py-3 text-left">Status</th>
                    <th class="px-4 py-3 text-left">Created Against</th>
                    <th class="px-4 py-3 text-left">Created</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-100 bg-white text-sm text-slate-600"></tbody>
        </table>
    </div>
    <div id="pagination-raised" class="mt-4"></div>
    <div id="against-me-cards" class="space-y-3 mt-4 hidden"></div>
    <div id="against-me-section" class="table-scroll mt-4 hidden">
        <table id="assigned-table" class="enhanced-table">
            <thead class="bg-slate-50 text-xs uppercase tracking-[0.3em] text-slate-400">
                <tr>
                    <th class="px-4 py-3 text-left">ID</th>
                    <th class="px-4 py-3 text-left">Type</th>
                    <th class="px-4 py-3 text-left">Status</th>
                    <th class="px-4 py-3 text-left">Created By</th>
                    <th class="px-4 py-3 text-left">Created</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-100 bg-white text-sm text-slate-600"></tbody>
        </table>
    </div>
    <div id="pagination-against" class="mt-4"></div>
</section>
<script src="/static/js/hiccups-helpers.js?v=20260309c"></script>
<script src="/static/js/hiccups.js?v=20260715a"></script>
{% endblock %}
