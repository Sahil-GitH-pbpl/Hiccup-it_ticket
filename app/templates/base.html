<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title if title else "Dr Bhasin's Hiccup Module" }}</title>
    <script src="/static/js/tailwind.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              tealbrand: "#0db29c",
              "tealbrand-dark": "#0a7f6f",
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="/static/style.css" />
    <script>
      // Seed currentUser early from server context if available.
      window.currentUser =
        window.currentUser ||
        {% if user is defined and user %}
        {
          user_id: {{ user.user_id }},
          role: "{{ user.role }}",
          name: "{{ user.name }}",
          department_id: {{ user.department_id if user.department_id is not none else "null" }},
          designation: "{{ user.designation or '' }}",
          is_admin_like: {{ 'true' if (is_admin_like if is_admin_like is defined else (user.user_id in [124, 125] if user.user_id is defined else false) or (user.is_admin_like if user.is_admin_like is defined else false)) else 'false' }},
          is_infra_admin: {{ 'true' if ((user.user_id == 95 if user.user_id is defined else false) or (user.is_infra_admin if user.is_infra_admin is defined else False)) else 'false' }},
        }
        {% else %}
        {}
        {% endif %};
      {% set _designation = (user.designation if user is defined and user else '')|lower %}
      {% set _role = (user.role if user is defined and user else '')|lower %}
      {% if is_admin_like is defined %}
        {% set _is_admin_like = is_admin_like %}
      {% else %}
        {% set _is_admin_like = 'admin' in _designation or 'it' in _designation or 'infra' in _designation or 'admin' in _role or 'it' in _role or 'infra' in _role %}
      {% endif %}
      {% if is_admin_like is defined %}
        {% set _can_view_all_hiccups_nav = is_admin_like %}
      {% else %}
        {% set _can_view_all_hiccups_nav = user is defined and user and ((user.user_id in [124, 125] if user.user_id is defined else false) or (user.is_admin_like if user.is_admin_like is defined else false)) %}
      {% endif %}
      {% set _can_view_dashboard_nav = _can_view_all_hiccups_nav %}
      window.serverIsAdmin = {{ 'true' if _is_admin_like else 'false' }};
      window.serverCanViewAllHiccups = {{ 'true' if _can_view_all_hiccups_nav else 'false' }};
    </script>
    {% block head_extra %}{% endblock %}
    <link rel="stylesheet" href="/static/css/shared-navbar.css?v=20260901h" />
    <style>
      html,
      body {
        color: #0f172a;
        background: radial-gradient(
            circle at top,
            rgba(59, 130, 246, 0.15),
            transparent 45%
        ),
          #f8fafc;
        min-height: 100vh;
        max-width: 100%;
        overflow-x: hidden;
        scrollbar-gutter: stable;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      .app-content-wrapper,
      .app-shell {
        max-width: 100%;
        min-width: 0;
        overflow-x: clip;
      }
    </style>
  </head>
  <body {% block body_attrs %}class="text-slate-900 min-h-screen"{% endblock %}>
    <div class="relative isolate min-h-screen">
      {% include 'partials/shared_navbar.html' %}
      <div class="app-content-wrapper relative mx-auto mt-2">
        <main class="app-shell">{% block body %}{% block content %}{% endblock %}{% endblock %}</main>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/static/js/main.js?v=20260814a" defer></script>
    <script src="/static/js/shared-navbar.js?v=20261006a" defer></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
